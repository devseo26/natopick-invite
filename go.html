<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>나또픽 — 아이 픽업 알림을 온 가족이 함께</title>
    <meta name="description" content="학원·유치원 픽업 시간 전에 엄마·아빠·할머니 폰에 같이 알람이 울려요. 갤럭시 전용 · 무료" />
    <!-- 카톡 미리보기 카드 (2026-10-17 사장님 "더 임팩트있게") — 그림이 없으면 글자만 있는 납작한 카드가 붙는다.
         그림은 스토어 그래픽(store/feature-graphic-1024x500.png, 실제 1024x1024 JPEG)과 같은 것 -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://devseo26.github.io/natopick-invite/go.html" />
    <meta property="og:title" content="나또픽 — 학원 픽업, 가족 모두에게 알람" />
    <meta property="og:description" content="픽업 시간 전에 엄마·아빠·할머니 폰이 동시에 울려요 · 갤럭시 전용 · 무료" />
    <meta property="og:image" content="https://devseo26.github.io/natopick-invite/og.jpg" />
    <meta property="og:image:width" content="1024" />
    <meta property="og:image:height" content="1024" />
    <!--
      유입 링크 착지 페이지 (2026-10-16, docs/GROWTH_UX.md — 사장님 "모든 건 유입부터")
        go.html?src=referral            앱 안 '다른 학부모에게 알려주기'
        go.html?src=share               공유한 시간표 이미지·PDF
        go.html?src=academy&c=<학원>    학원 단톡 공지·입구 QR (c 는 영문·숫자 약칭)
      하는 일: 안드로이드면 Play 스토어로 바로 보낸다 — referrer 에 utm_source/medium/campaign 을 실어서.
        앱이 첫 실행 때 그 값을 읽어 install_source 로 남기고(lib/install-referrer.ts), 월 05:00 주간 리포트의
        '📥 설치 경로' 줄이 출처별로 센다. 그래서 링크마다 src 를 꼭 붙인다.
      ⚠️ 카톡 인앱 브라우저는 스토어로 못 넘긴다(join.html 과 같은 이유) → 외부 브라우저로 다시 연다.
      ⚠️ 값은 영문·숫자·_.- 40자만 남긴다 — 앱의 clean() 과 같은 규칙. 한글 학원명은 버려지니 약칭을 쓴다.
    -->
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
        background: #fff;
        color: #1a1a2e;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
      }
      .card { padding: 32px 24px; max-width: 380px; }
      h1 { font-size: 24px; margin: 0 0 6px; }
      .tag { font-size: 15px; color: #ef7b21; font-weight: 700; margin: 0 0 20px; }
      ul { padding-left: 20px; margin: 0 0 24px; color: #444; line-height: 1.7; font-size: 15px; }
      a.btn {
        display: block;
        text-align: center;
        background: #ef7b21;
        color: #fff;
        text-decoration: none;
        font-size: 17px;
        font-weight: 700;
        padding: 15px 20px;
        border-radius: 12px;
      }
      .note { margin-top: 14px; font-size: 13px; color: #888; text-align: center; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🍊 나또픽</h1>
      <p class="tag">아이 픽업 알림을 온 가족이 함께</p>
      <ul>
        <li>학원·유치원 픽업 시간 전에 <b>엄마·아빠·할머니 폰에 같이</b> 알람이 울려요</li>
        <li>무음이어도 크게 울리는 알람 — 놓치지 않아요</li>
        <li>요일별 시간표를 한 번만 넣으면 매주 알아서</li>
      </ul>
      <a id="cta" class="btn" href="#">Play 스토어에서 받기</a>
      <p class="note" id="note">갤럭시(안드로이드) 전용 · 무료</p>
    </div>
    <script>
      (function () {
        var PACKAGE = 'com.pickupseo.pickupalarm';
        var params = new URLSearchParams(location.search);
        function clean(v) {
          return (v || '').replace(/[^A-Za-z0-9_.-]/g, '').slice(0, 40);
        }
        var src = clean(params.get('src')) || 'web';
        var medium = clean(params.get('m')) || 'link';
        var camp = clean(params.get('c'));
        var ref = 'utm_source=' + src + '&utm_medium=' + medium + (camp ? '&utm_campaign=' + camp : '');
        // utm_source·utm_campaign 을 주소에도 — Play Console 획득 보고서가 캠페인을 센다(앱은 referrer 로 따로 센다, 2026-11-01 GoalStep 과 같게)
        var storeUrl =
          'https://play.google.com/store/apps/details?id=' + PACKAGE
          + '&utm_source=' + src + (camp ? '&utm_campaign=' + camp : '')
          + '&referrer=' + encodeURIComponent(ref);
        var cta = document.getElementById('cta');
        cta.setAttribute('href', storeUrl);

        var ua = navigator.userAgent || '';
        // 안드로이드 판별(2026-11-01 — 사장님 "GoalStep 처럼 바로 스토어로", appmonitor 전달 · GoalStep 1a932ed 와 같은 방식).
        //   삼성 인터넷은 태블릿(S9FE)에서 'PC 화면'(데스크톱 UA)으로 열어 UA 에 Android 가 없다 → PC 로 보고 자동 이동을 안 해
        //   'Play 스토어에서 받기' 단추만 남았다(폰은 UA 에 Android 가 있어 원래 자동). 그래서 셋을 같이 본다:
        //   브라우저가 알려 주는 플랫폼 · 카톡에서 넘길 때 붙인 표시(k=a) · 리눅스+터치(크롬북 제외)
        var uaPlat = (navigator.userAgentData && navigator.userAgentData.platform) || '';
        var touch = (navigator.maxTouchPoints || 0) > 1;
        var isAndroid = /android/i.test(ua) || /android/i.test(uaPlat) || params.get('k') === 'a'
          || (/Linux/i.test(ua) && !/CrOS/i.test(ua) && touch);
        // 아이패드는 'Macintosh'+터치로 온다 — 아이폰 문구를 줄지 PC 문구를 줄지 가른다
        var isIos = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/i.test(ua) && touch);
        var inKakao = /KAKAOTALK/i.test(ua);
        // 링크 누름 기록(2026-11-07 — appmonitor 요청서 ③, GoalStep go.html 과 같은 단계·같은 로봇 목록).
        //   kakao = 카톡 안에서 외부 브라우저로 넘기기 직전 · ext = 외부(마지막) 브라우저 · kakao_btn = 카톡 안 'Play 스토어 앱에서 받기' 단추.
        //   kakao 만 있고 ext 가 없으면 '카톡이 외부로 못 넘긴다'. 숫자는 08:10 계기판 '· 어제 링크 누름'.
        //   남기는 것은 페이지·src/m/c·폰 종류·단계뿐. 로봇은 안 센다(서버 link-click 도 한 번 더 거른다).
        //   sendBeacon 먼저(페이지가 넘어가도 브라우저가 끝까지 보낸다) — text/plain 이라 다른 주소로 보내도 사전 확인(CORS)이 없다.
        var isBot = /bot|spider|crawl|render|headless|slurp|preview|facebookexternalhit|lighthouse/i.test(ua);
        function hit(stage) {
          if (isBot) return;
          var url = 'https://ffliuxwjxhyiipshpruf.supabase.co/functions/v1/link-click';
          var body = JSON.stringify({ page: 'go', src: src, m: medium, c: camp,
            os: isAndroid ? 'android' : isIos ? 'ios' : 'other', stage: stage });
          try {
            if (navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], { type: 'text/plain' }))) return;
          } catch (e) {}
          try {
            fetch(url, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain' }, body: body })
              .catch(function () {});
          } catch (e) {}
        }
        if (isAndroid && inKakao) {
          hit('kakao');
          // 외부 브라우저로 못 넘어가는 폰 대비(2026-10-20 — GoalStep 10/20 계기판 '카톡 안 1 · 외부 0', appmonitor 전달).
          //   카톡 안에서 https 스토어 주소를 누르면 카톡 안에 웹 스토어가 뜨고 출처(referrer)가 사라진다 →
          //   단추는 **Play 스토어 앱을 바로** 연다(market 인텐트, referrer 그대로 — 사람이 누르는 거라 카톡이 막지 않는다).
          //   크롬 강제(package=com.android.chrome)는 크롬을 꺼 둔 폰에서 오히려 막혀 안 쓴다(GoalStep 실측).
          cta.setAttribute('href', 'intent://details?id=' + PACKAGE + '&referrer=' + encodeURIComponent(ref)
            + '#Intent;scheme=market;package=com.android.vending;end');
          cta.textContent = 'Play 스토어 앱에서 받기';
          cta.addEventListener('click', function () { hit('kakao_btn'); });
          document.getElementById('note').textContent = '스토어가 안 열리면 오른쪽 위 ⋮ → 다른 브라우저로 열기';
          // 외부 브라우저에도 '안드로이드에서 왔다'를 알린다(k=a) — 태블릿 삼성 인터넷은 PC 화면으로 열려 스스로 못 안다
          var ext = location.href + (location.href.indexOf('?') === -1 ? '?' : '&') + 'k=a';
          // 기록이 나갈 틈을 아주 잠깐 둔다(sendBeacon 이라 넘어가도 가지만 — GoalStep 과 같게)
          setTimeout(function () {
            location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(ext);
          }, 150);
          return;
        }
        hit('ext');
        if (isAndroid) {
          // 바로 스토어로 — 기록이 나갈 틈을 0.3초 둔다. 버튼은 자동 이동이 막혔을 때를 위한 것
          setTimeout(function () { location.href = storeUrl; }, 300);
        } else {
          document.getElementById('note').textContent = isIos
            ? '갤럭시(안드로이드) 전용 앱이에요. 아이폰에서는 아직 쓸 수 없어요.'
            : '갤럭시(안드로이드) 전용 앱이에요. 폰에서 이 링크를 열어 주세요.';
        }
      })();
    </script>
  </body>
</html>
