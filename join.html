<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>나또픽 가족 초대</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo',
          'Malgun Gothic', sans-serif;
        background: #fff;
        color: #1a1a2e;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .card {
        padding: 32px 24px;
        max-width: 360px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 8px;
      }
      p {
        font-size: 15px;
        color: #666;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      a.btn {
        display: inline-block;
        background: #ef7b21;
        color: #fff;
        text-decoration: none;
        font-size: 16px;
        font-weight: 600;
        padding: 14px 28px;
        border-radius: 12px;
      }
      .steps {
        text-align: left;
        margin: 22px auto 0;
        padding-left: 20px;
        color: #444;
        font-size: 14px;
        line-height: 1.8;
        max-width: 280px;
      }
      .note { margin-top: 10px; font-size: 13px; color: #999; }
      .code {
        margin-top: 20px;
        font-size: 13px;
        color: #999;
      }
      .code b {
        color: #1a1a2e;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>🍊 나또픽 가족 초대</h1>
      <p id="msg">앱을 여는 중이에요…<br />잠시 후에도 안 열리면 아래 버튼을 눌러주세요.</p>
      <a id="cta" class="btn" href="#">앱 열기 / 설치하기</a>
      <!-- 받는 사람이 할 일 3단계 (2026-10-16 — 초대코드 22개 중 1개만 쓰였다, docs/GROWTH_UX.md P0-4) -->
      <ol class="steps" id="steps">
        <li>Play 스토어에서 <b>설치</b></li>
        <li>나또픽을 열고 <b>카카오로 시작하기</b></li>
        <li>자동으로 우리 가족에 들어가요</li>
      </ol>
      <p class="note">갤럭시(안드로이드) 전용 · 무료</p>
      <div class="code" id="codeBox"></div>
    </div>
    <script>
      (function () {
        var PACKAGE = 'com.pickupseo.pickupalarm';
        var params = new URLSearchParams(location.search);
        var code = (params.get('code') || '').trim().toUpperCase();

        var cta = document.getElementById('cta');
        var msg = document.getElementById('msg');
        var codeBox = document.getElementById('codeBox');

        if (!code) {
          msg.textContent = '초대 코드가 없는 링크예요. 초대해 준 가족에게 링크를 다시 받아주세요.';
          cta.style.display = 'none';
          return;
        }

        codeBox.innerHTML = '초대코드 <b>' + code + '</b>';

        var ua = navigator.userAgent || '';
        // 안드로이드 판별(2026-11-01 — 사장님 "GoalStep 처럼 바로 스토어로", appmonitor 전달 · GoalStep 1a932ed 와 같은 방식).
        //   삼성 인터넷은 태블릿(S9FE)에서 'PC 화면'(데스크톱 UA)으로 열어 UA 에 Android 가 없다 → PC 로 보고 자동 이동을 안 해
        //   'Play 스토어에서 받기' 단추만 남았다(폰은 UA 에 Android 가 있어 원래 자동). 그래서 셋을 같이 본다:
        //   브라우저가 알려 주는 플랫폼 · 카톡에서 넘길 때 붙인 표시(k=a) · 리눅스+터치(크롬북 제외)
        var uaPlat = (navigator.userAgentData && navigator.userAgentData.platform) || '';
        var touch = (navigator.maxTouchPoints || 0) > 1;
        var isAndroid = /android/i.test(ua) || /android/i.test(uaPlat) || params.get('k') === 'a'
          || (/Linux/i.test(ua) && !/CrOS/i.test(ua) && touch);
        // 아이패드는 'Macintosh'+터치로 온다 — 아이폰 문구를 줄지 PC 문구를 줄지 가른다
        var isIos = /iphone|ipad|ipod/i.test(ua) || (/Macintosh/i.test(ua) && touch);
        var inKakao = /KAKAOTALK/i.test(ua);
        // 링크 누름 기록(2026-11-07 — go.html 과 같은 단계, 설명은 그쪽). 초대 링크는 출처를 invite/link 로만 남긴다 —
        //   ⚠️ 초대 코드는 절대 보내지 않는다(가족방에 들어가는 열쇠다). 서버(link-click)도 join 이면 c 를 버린다.
        var isBot = /bot|spider|crawl|render|headless|slurp|preview|facebookexternalhit|lighthouse/i.test(ua);
        function hit(stage) {
          if (isBot) return;
          var url = 'https://ffliuxwjxhyiipshpruf.supabase.co/functions/v1/link-click';
          var body = JSON.stringify({ page: 'join', os: isAndroid ? 'android' : isIos ? 'ios' : 'other', stage: stage });
          try {
            if (navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], { type: 'text/plain' }))) return;
          } catch (e) {}
          try {
            fetch(url, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain' }, body: body })
              .catch(function () {});
          } catch (e) {}
        }

        // 카톡 인앱 브라우저는 intent:// 앱 실행을 막는다 → 외부 브라우저(크롬)로 넘긴다.
        if (isAndroid && inKakao) {
          hit('kakao');
          // 외부 브라우저로 못 넘어가는 폰 대비(2026-10-20, go.html 과 같은 이유 — appmonitor 전달).
          //   단추는 Play 스토어 앱을 바로 연다 — referrer 에 invite=코드를 실어 **설치 뒤 자동 참여는 그대로**.
          //   앱이 이미 있으면 스토어가 '열기'만 보여 코드가 안 넘어간다 → 아래에 코드를 크게 보여 직접 넣게 한다.
          cta.setAttribute('href', 'intent://details?id=' + PACKAGE + '&referrer=' + encodeURIComponent('invite=' + code)
            + '#Intent;scheme=market;package=com.android.vending;end');
          cta.textContent = 'Play 스토어 앱에서 받기';
          cta.addEventListener('click', function () { hit('kakao_btn'); });
          msg.innerHTML = '앱으로 넘어가는 중이에요…<br />안 넘어가면 아래 단추를 눌러 주세요.<br />' +
            '앱이 이미 있으면 앱을 열고 초대코드를 넣어 주세요.<br />스토어가 안 열리면 오른쪽 위 ⋮ → 다른 브라우저로 열기';
          // 외부 브라우저에도 '안드로이드에서 왔다'를 알린다(k=a) — 태블릿 삼성 인터넷은 PC 화면으로 열려 스스로 못 안다
          var ext = location.href + (location.href.indexOf('?') === -1 ? '?' : '&') + 'k=a';
          setTimeout(function () {
            location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(ext);
          }, 150);
          return;
        }
        hit('ext');

        var storeUrl =
          'https://play.google.com/store/apps/details?id=' +
          PACKAGE +
          '&referrer=' +
          encodeURIComponent('invite=' + code);

        if (isAndroid) {
          // 설치돼 있으면 앱(pickupalarm://join?code=)으로, 없으면 스토어(referrer)로.
          var intentUrl =
            'intent://join?code=' +
            encodeURIComponent(code) +
            '#Intent;scheme=pickupalarm;package=' +
            PACKAGE +
            ';S.browser_fallback_url=' +
            encodeURIComponent(storeUrl) +
            ';end';
          cta.setAttribute('href', intentUrl);
          // 바로 시도 — 기록이 나갈 틈을 0.3초 둔다(go.html 과 같게)
          setTimeout(function () { location.href = intentUrl; }, 300);
        } else {
          // iOS·데스크톱: 안드로이드 전용 앱이므로 스토어로 안내
          cta.setAttribute('href', storeUrl);
          msg.textContent = isIos
            ? '나또픽은 갤럭시(안드로이드) 전용 앱이에요. 아이폰에서는 아직 쓸 수 없어요 — 초대해 준 가족에게 알려 주세요.'
            : '나또픽은 갤럭시(안드로이드) 전용 앱이에요. 폰에서 이 링크를 열어 주세요.';
          document.getElementById('steps').style.display = 'none';
        }
      })();
    </script>
  </body>
</html>
